<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a1f3d">
  <meta name="description" content="Genera cartas de lotería mexicana en un PDF listo para imprimir.">
  <title>Loterías Mare</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main class="contenedor">
    <header class="encabezado">
      <h1>Loterías Mare</h1>
      <p class="subtitulo">Genera tus cartas en un PDF listo para imprimir.</p>
    </header>

    <!-- Carga inicial de imagenes -->
    <section id="carga" class="tarjeta" aria-live="polite">
      <p id="carga-texto">Cargando imágenes…</p>
      <div class="barra" role="progressbar" aria-label="Carga de imágenes" aria-valuemin="0" aria-valuemax="100">
        <div id="carga-relleno" class="barra-relleno"></div>
      </div>
      <button id="btn-reintentar" class="boton boton-secundario" type="button" hidden>Intentar de nuevo</button>
    </section>

    <form id="formulario" class="tarjeta" novalidate>
      <fieldset id="tipos" class="tipos">
        <legend>1. Elige el tipo de lotería</legend>
        <!-- Las opciones se crean desde js/tipos.js -->
      </fieldset>

      <div class="campo">
        <label for="cantidad">2. ¿Cuántas cartas?</label>
        <input id="cantidad" name="cantidad" type="text" inputmode="numeric" pattern="[0-9]*"
               autocomplete="off" value="10" aria-describedby="limite">
        <p id="limite" class="ayuda">Máximo 300 cartas.</p>
        <p id="error-cantidad" class="error-campo" role="alert" hidden></p>
      </div>

      <button id="btn-generar" class="boton boton-principal" type="submit" disabled>Generar</button>
    </form>

    <!-- Progreso del trabajo -->
    <section id="trabajo" class="tarjeta" hidden aria-live="polite">
      <p id="trabajo-texto">Preparando…</p>
      <div class="barra" role="progressbar" aria-label="Progreso" aria-valuemin="0" aria-valuemax="100">
        <div id="trabajo-relleno" class="barra-relleno"></div>
      </div>
      <button id="btn-cancelar" class="boton boton-secundario" type="button">Cancelar</button>
    </section>

    <!-- Resultado -->
    <section id="resultado" class="tarjeta resultado" hidden aria-live="polite">
      <p id="resultado-texto"></p>
      <a id="btn-descargar" class="boton boton-principal" href="#" download>Descargar de nuevo</a>
    </section>

    <!-- Mensajes de error -->
    <section id="aviso" class="tarjeta aviso" role="alert" hidden>
      <p id="aviso-texto"></p>
    </section>

    <footer class="pie">
      <p>Todo se genera en tu dispositivo; no se sube nada a internet.</p>
    </footer>
  </main>

  <script src="js/tipos.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/motor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
